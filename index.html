<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22341a">
  <title>Eleição de Liderança 2026</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("tema")||"escuro"}catch(e){document.documentElement.dataset.tema="escuro"}</script>
</head>
<body>
  <!-- TELA INICIAL (boas-vindas) -->
  <button type="button" class="botao-tema flutuante" id="btn-tema" aria-label="Trocar tema"></button>
  <main class="inicio">
    <div class="inicio-centro">
      <img id="logo" class="logo-completa" src="img/logo.png" alt="Igreja Cristã Presbiteriana Missionária">

      <div class="ornamento">✦</div>

      <h1 id="titulo">Eleição de Liderança 2026</h1>

      <p class="chamada" id="chamada">
        Escolha em oração os irmãos que servirão como <strong>Pastores</strong>,
        <strong>Presbíteros</strong> e <strong>Diáconos</strong>. Seu voto é secreto.
      </p>

      <!-- Preenchido pelo JavaScript conforme a situação da votação -->
      <div id="acao" class="mt-g" style="width:100%">
        <p class="texto-suave">Carregando…</p>
      </div>

      <p id="periodo" class="pequeno texto-suave mt"></p>
      <a id="link-resultados" class="pequeno oculto mt" href="resultados.html" style="font-weight:600">Ver resultados</a>
    </div>
    <div class="faixa" style="height:8px"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/comum.js?v=3"></script>
  <script src="js/aviso-etapa.js?v=3"></script>
  <script>
    // abre na hora com os dados guardados no aparelho e atualiza assim que o servidor responde
    (async function () {
      const guardada = lerInfoGuardada(24 * 3600000);
      if (guardada) mostrar(guardada);
      const { ok, dados } = await chamar("info");
      if (!ok) {
        if (!guardada) $("#acao").innerHTML = `<div class="alerta erro">${esc(dados.error || "Não foi possível carregar. Tente novamente em instantes.")}</div>`;
        return;
      }
      guardarInfo(dados);
      if (!guardada || JSON.stringify(guardada) !== JSON.stringify(dados)) mostrar(dados);
    })();

    function mostrar(dados) {
      const acao = $("#acao");
      document.title = dados.title;
      $("#titulo").textContent = dados.title;
      if (dados.logo_url) $("#logo").src = dados.logo_url;

      // texto conforme a etapa (1: Pastores/Presbíteros/Diáconos; 2: Tesoureiro; 3: Secretários; 4: Exame de Contas)
      if (dados.fase > 1) {
        $("#chamada").innerHTML = `Etapa ${dados.fase} de ${(dados.fases || []).length}: escolha em oração para <strong>${esc(dados.fase_label)}</strong>. Seu voto é secreto.`;
      }
      if (dados.status === "open") {
        acao.innerHTML = `<a href="votar.html" class="btn btn-principal btn-grande largura-total">Iniciar Votação${dados.fase > 1 ? " · " + esc(dados.fase_label) : ""}</a>`;
      } else if (dados.status === "paused") {
        acao.innerHTML = `<div class="caixa-status" style="background:var(--verde-100)">
          <strong>Aguarde a próxima etapa</strong>
          <span class="pequeno">A votação desta etapa está encerrada.</span></div>
          <div id="vigia" class="mt"></div>`;
        vigiarProximaEtapa($("#vigia"));
      } else if (dados.status === "not_started") {
        acao.innerHTML = `<div class="caixa-status" style="background:var(--verde-100)">
          <strong>Votação ainda não começou</strong>
          <span class="pequeno">Início: ${dataHora(dados.start_at)}</span></div>`;
      } else {
        acao.innerHTML = `<div class="caixa-status" style="background:var(--laranja-100)">
          <strong>Votação encerrada</strong>
          <span class="pequeno">Obrigado a todos que participaram.</span></div>`;
      }
      if (dados.start_at || dados.end_at) {
        $("#periodo").textContent = `Período: ${dataHora(dados.start_at)} até ${dataHora(dados.end_at)}`;
      }
      $("#link-resultados").classList.toggle("oculto", !dados.results_public);
    }
  </script>
</body>
</html>
