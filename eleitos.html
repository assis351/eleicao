<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22341a">
  <title>Nova Liderança · Igreja Cristã Presbiteriana Missionária</title>
  <meta name="description" content="Conheça a liderança eleita em assembleia.">
  <meta property="og:title" content="Nova Liderança · Igreja Cristã Presbiteriana Missionária">
  <meta property="og:description" content="Conheça a liderança eleita em assembleia.">
  <meta property="og:image" content="https://assis351.github.io/eleicao/img/logo.png">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.eleitos { background: #f7f8f2; }
    .el-topo { background: radial-gradient(ellipse at 20% 0%, #2b4220 0%, #141f0c 75%); color: #fff; text-align: center;
      padding: 40px 16px 56px; position: relative; }
    .el-topo .selo-grande { width: 112px; height: 112px; border-radius: 50%; background: #f7f8f2; display: inline-flex;
      align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .el-topo .selo-grande img { width: 86px; height: 86px; object-fit: contain; }
    .el-igreja { margin-top: 18px; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--laranja-300); }
    .el-topo h1 { font-size: clamp(36px, 8vw, 60px); font-weight: 900; line-height: 1.02; margin: 8px 0 6px; }
    .el-topo p { margin: 0; color: #c9d6b8; font-size: 18px; }
    .el-faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--verde-600), var(--laranja-500)); }
    .el-corpo { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
    .el-secao { margin-top: 36px; }
    .el-secao h2 { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--laranja-600);
      display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
    .el-secao h2::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
    .el-diretoria { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: -28px; }
    .el-cargo { background: #fff; border-radius: 20px; padding: 22px 16px 20px; text-align: center; border-top: 6px solid var(--laranja-500);
      box-shadow: 0 10px 30px rgba(20,31,12,.10); }
    .el-cargo .c { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--laranja-600); margin-top: 12px; }
    .el-cargo .n { font-size: 21px; font-weight: 800; line-height: 1.2; margin-top: 4px; color: var(--verde-900); }
    .el-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .el-pessoa { background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 18px 12px; text-align: center; }
    .el-pessoa .n { font-size: 17px; font-weight: 700; line-height: 1.25; margin-top: 10px; color: var(--verde-900); }
    .el-pessoa .tag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      background: var(--verde-100); color: var(--verde-700); border-radius: 99px; padding: 3px 10px; }
    .el-foto { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3b5230, #22341a); color: #f5b67e; font-weight: 800; font-size: 28px; border: 3px solid #fff;
      box-shadow: 0 0 0 2px var(--verde-100); }
    .el-cargo .el-foto { width: 104px; height: 104px; font-size: 34px; }
    .el-acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 40px; }
    .el-rodape { text-align: center; margin-top: 24px; }
    .el-espera { max-width: 520px; margin: -28px auto 0; text-align: center; }
  </style>
</head>
<body class="eleitos">
  <header class="el-topo">
    <div class="selo-grande"><img src="img/logo.png" alt="Logo da igreja" id="el-logo"></div>
    <div class="el-igreja" id="el-igreja">Igreja Cristã Presbiteriana Missionária</div>
    <h1>Nova Liderança</h1>
    <p id="el-sub">Eleita em assembleia</p>
    <div class="el-faixa"></div>
  </header>

  <main class="el-corpo" id="el-corpo">
    <p class="texto-suave" style="text-align:center;padding:48px 0">Carregando…</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/eleitos.js"></script>
</body>
</html>
